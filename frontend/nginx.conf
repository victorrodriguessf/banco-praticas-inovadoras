# Configuração do nginx para servir a SPA sob o subpath /bancodepraticas/.
# Usada no estágio de produção do Dockerfile (imagem nginx-unprivileged,
# que roda como usuário não-root e escuta na porta 8080).
#
# O build (dist/) é copiado para /usr/share/nginx/html/bancodepraticas, de
# modo que o segmento do caminho existe fisicamente e `root` resolve os
# arquivos sem os problemas conhecidos de `alias` + location regex.

server {
    listen       8080;
    server_name  _;

    root /usr/share/nginx/html;

    # Compressão dos assets de texto
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Raiz -> app. Evita o "Welcome to nginx" padrão quando abrem o domínio cru.
    location = / {
        return 301 /bancodepraticas/;
    }

    # Redireciona /bancodepraticas -> /bancodepraticas/ (garante a barra final)
    location = /bancodepraticas {
        return 301 /bancodepraticas/;
    }

    # Assets versionados (hash no nome) — cache longo e imutável
    location ~* ^/bancodepraticas/.*\.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico)$ {
        try_files  $uri =404;
        expires    1y;
        add_header  Cache-Control "public, immutable";
    }

    # App + fallback de SPA: qualquer rota do react-router cai no index.html
    location /bancodepraticas/ {
        try_files  $uri $uri/ /bancodepraticas/index.html;
    }

    # Endpoint simples para healthcheck do orquestrador
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}
