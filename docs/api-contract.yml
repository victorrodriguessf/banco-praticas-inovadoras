openapi: 3.0.3
info:
  title: Banco de Práticas Educação Inovadora — API
  description: >
    Contrato da API do backend do Banco de Práticas Educação Inovadora (Senac RN).
    Definido de forma API-first (Sprint 0) para orientar o desenvolvimento do
    backend e permitir que o frontend use mocks (MSW) enquanto as rotas reais
    não estão prontas.
  version: 0.1.0
servers:
  - url: http://localhost:3333
    description: Ambiente de desenvolvimento local

tags:
  - name: Auth
    description: Autenticação de usuários (docentes/administradores)
  - name: Submissões
    description: Envio de práticas educacionais para os editais
  - name: Editais
    description: Consulta de editais do programa Educação Inovadora

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Autentica um usuário e retorna um token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Autenticação bem-sucedida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register/request:
    post:
      tags: [Auth]
      summary: Inicia o cadastro de um docente e envia um código OTP para o e-mail institucional
      description: >
        Valida que o e-mail termina em `@rn.senac.br`, gera um código de 6 dígitos e
        aciona o Webhook do Power Automate para o envio do e-mail. A conta fica
        criada como não-verificada até a confirmação em `/auth/register/verify`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Código de verificação enviado
        '400':
          description: E-mail fora do domínio institucional ou dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/register/verify:
    post:
      tags: [Auth]
      summary: Confirma o código OTP e finaliza o cadastro, retornando o JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterVerifyRequest'
      responses:
        '200':
          description: Cadastro confirmado, usuário autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Código inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/forgot-password/request:
    post:
      tags: [Auth]
      summary: Solicita a recuperação de senha, enviando um código OTP para o e-mail informado
      description: >
        Resposta sempre genérica (200), exista o e-mail ou não, para não permitir
        enumeração de contas. Se o e-mail pertencer a uma conta verificada, um
        código de 6 dígitos é gerado e enviado via Webhook do Power Automate
        (mesmo mecanismo do cadastro, com `contexto: "RECUPERACAO_SENHA"`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Se o e-mail existir, um código de recuperação foi enviado

  /auth/forgot-password/reset:
    post:
      tags: [Auth]
      summary: Confirma o código OTP e define uma nova senha, retornando o JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordResetRequest'
      responses:
        '200':
          description: Senha redefinida, usuário autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Código inválido/expirado ou senha fora do padrão exigido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /upload:
    post:
      tags: [Submissões]
      summary: Envia um arquivo de evidência (imagem) para o MinIO
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                arquivo:
                  type: string
                  format: binary
      responses:
        '201':
          description: Arquivo enviado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: http://localhost:9000/banco-de-praticas/uuid-imagem.png
        '400':
          description: Nenhum arquivo enviado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /submissoes:
    post:
      tags: [Submissões]
      summary: Recebe os dados do formulário de submissão de uma prática
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissaoRequest'
      responses:
        '201':
          description: Submissão criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submissao'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Não autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /editais/ativos:
    get:
      tags: [Editais]
      summary: Lista os editais atualmente em andamento
      responses:
        '200':
          description: Lista de editais ativos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Edital'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
          example: docente@senac.br
        senha:
          type: string
          format: password
          example: minhaSenha123

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: Token JWT para autenticação nas próximas requisições
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        usuario:
          type: object
          properties:
            id:
              type: string
            nome:
              type: string
            email:
              type: string

    RegisterRequest:
      type: object
      required: [nome, email, senha]
      properties:
        nome:
          type: string
          example: Thalissa Vitória Pinto Soares
        email:
          type: string
          format: email
          example: thalissa.soares@rn.senac.br
        senha:
          type: string
          format: password

    RegisterVerifyRequest:
      type: object
      required: [email, codigo]
      properties:
        email:
          type: string
          format: email
        codigo:
          type: string
          example: '482913'

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: thalissa.soares@rn.senac.br

    ForgotPasswordResetRequest:
      type: object
      required: [email, codigo, novaSenha]
      properties:
        email:
          type: string
          format: email
        codigo:
          type: string
          example: '482913'
        novaSenha:
          type: string
          format: password

    SubmissaoRequest:
      type: object
      required: [titulo, editalId, autores, unidades, segmentos, categoria, descricao, termosAceitos]
      properties:
        titulo:
          type: string
          example: Ecoponto Sustentável - Liderança e Inovação Alinhadas aos ODS
        editalId:
          type: string
          example: edital-2026
        autores:
          type: array
          items:
            type: string
          example: [Thalissa Vitória Pinto Soares]
        unidades:
          type: array
          items:
            type: string
          example: [Zona Norte]
        segmentos:
          type: array
          items:
            type: string
          example: [Gestão - Qualificação em Serviços Comerciais]
        cursos:
          type: array
          items:
            type: string
        categoria:
          type: string
          example: Sustentabilidade
        descricao:
          type: string
        ods:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 17
        marcasFormativas:
          type: array
          items:
            type: string
        termosAceitos:
          type: boolean
        anexos:
          type: array
          items:
            type: string
          description: URLs dos arquivos enviados via /upload

    Submissao:
      allOf:
        - $ref: '#/components/schemas/SubmissaoRequest'
        - type: object
          properties:
            id:
              type: string
            status:
              type: string
              enum: [recebida, em_analise, aprovada, reprovada]
              example: recebida
            criadaEm:
              type: string
              format: date-time

    Edital:
      type: object
      properties:
        id:
          type: string
          example: edital-2026
        nome:
          type: string
          example: Educação Inovadora 2026
        dataInicio:
          type: string
          format: date
        dataFim:
          type: string
          format: date
        status:
          type: string
          enum: [em_andamento, encerrado, planejado]
          example: em_andamento

    Error:
      type: object
      properties:
        message:
          type: string
          example: Mensagem descritiva do erro
