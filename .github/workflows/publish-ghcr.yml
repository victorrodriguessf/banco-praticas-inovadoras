# Publica a imagem Docker do FRONTEND no GitHub Container Registry (GHCR)
# a cada push na branch main. O servidor (ex.: Coolify) consome a tag :latest.
name: Publicar imagem do frontend no GHCR

on:
  # Executa a cada push na main
  push:
    branches:
      - main
  # Permite disparar manualmente pela aba Actions
  workflow_dispatch:

env:
  # Registro de containers do GitHub
  REGISTRY: ghcr.io
  # Nome da imagem: <owner>/<repo>-frontend (sufixo para não colidir com o backend)
  IMAGE_NAME: ${{ github.repository }}-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Permissões mínimas para o token automático do GitHub Actions
    permissions:
      contents: read
      packages: write

    steps:
      # Baixa o código do repositório para o runner
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      # Faz login no GHCR usando o token automático (não precisa criar PAT)
      - name: Fazer login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Gera o nome da imagem (em minúsculas — exigência do Docker/GHCR) e as tags
      - name: Definir nome e tags da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long

      # Habilita o Buildx (necessário para cache e multistage com target)
      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Constrói o estágio "production" (nginx não-root) e publica no GHCR
      - name: Construir e publicar a imagem
        uses: docker/build-push-action@v6
        with:
          # Contexto de build = pasta do frontend
          context: ./frontend
          file: ./frontend/Dockerfile
          # Estágio de produção do Dockerfile multistage
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache de camadas via GitHub Actions (builds seguintes mais rápidos)
          cache-from: type=gha
          cache-to: type=gha,mode=max
